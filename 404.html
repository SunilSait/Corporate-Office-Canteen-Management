<div class="auth-page" style="min-height:100vh;">
    <div class="auth-top-icons">

        <!-- Illustrated 404 -->

            <div class="relative inline-block">
                <span class="text-[120px] md:text-[160px] font-extrabold leading-none" style="font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#C2410C,#EA580C,#9A3412);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0.15;">404</span>

                    </div>

            </div>
        </div>
        <h1 style="font-size:1.8rem;margin-bottom:8px;">Oops! Empty Plate</h1>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="index.html" class="btn btn-primary btn-shine"><i class="fas fa-home text-xs"></i> Go Home</a>
